<text class="b" x="482" y="388">J · sobreperforación</text>
<text class="sm" x="482" y="354">Nivel de piso de proyecto</text>
<path class="th" d="M380 396 V428"/>
<text class="l" x="380" y="446" text-anchor="middle">Cebo (booster)</text>
<rect x="660" y="170" width="190" height="170" rx="6" class="th" style="stroke-width:1"/>
<text class="b" x="676" y="194">Leyenda</text>
<rect x="676" y="208" width="26" height="14" fill="#F5F2EC" fill-opacity=".07" class="th" style="stroke-width:1"/><text class="l" x="712" y="220">Roca</text>
<rect x="676" y="234" width="26" height="14" fill="url(#ba-dots)" class="th" style="stroke-width:1"/><text class="l" x="712" y="246">Taco inerte</text>
<rect x="676" y="260" width="26" height="14" fill="#C5A45D" fill-opacity=".9" class="th" style="stroke-width:1"/><text class="l" x="712" y="272">Carga explosiva</text>
<circle cx="689" cy="293" r="5" fill="#C5A45D" stroke="#F5F2EC" stroke-width="1.2"/><text class="l" x="712" y="298">Cebo</text>
<path class="dm" d="M676 319 H702" marker-start="url(#ba-ar)" marker-end="url(#ba-ar)"/><text class="l" x="712" y="324">Cota</text>
<text class="b" x="666" y="368">Vista en planta (esquema)</text>
<path class="ln" d="M666 388 H840"/>
<path class="th" d="M676 388 l-6 -8 M696 388 l-6 -8 M716 388 l-6 -8 M736 388 l-6 -8 M756 388 l-6 -8 M776 388 l-6 -8 M796 388 l-6 -8 M816 388 l-6 -8"/>
<circle cx="710" cy="432" r="7" class="th"/><circle cx="710" cy="432" r="1.8" fill="#F5F2EC"/>
<circle cx="790" cy="432" r="7" class="th"/><circle cx="790" cy="432" r="1.8" fill="#F5F2EC"/>
<path class="dm" d="M690 388 V432" marker-start="url(#ba-ar)" marker-end="url(#ba-ar)"/><text class="b" x="676" y="414">B</text>
<path class="ex" d="M710 440 V464 M790 440 V464 M690 432 H702"/>
<path class="dm" d="M710 458 H790" marker-start="url(#ba-ar)" marker-end="url(#ba-ar)"/><text class="b" x="750" y="482" text-anchor="middle">S · espaciamiento</text>
</svg>
