<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="ba-t ba-d" fill="none">
<title id="ba-t">Sección transversal de un banco de voladura</title>
<desc id="ba-d">Esquema técnico de un banco de voladura con cara libre, barreno, taco, columna de carga, burden, espaciamiento, altura de banco y sobreperforación, con acotaciones y leyenda.</desc>
<style>
text{font-family:Poppins,system-ui,sans-serif;fill:#F5F2EC}
text{fill:#F5F2EC}
.h{font-size:21px;font-weight:600}
.s{font-size:13px;opacity:.75}
.l{font-size:14px}
.sm{font-size:12px;opacity:.8}
.b{font-size:15px;font-weight:600;fill:#C5A45D}
.ln{stroke:#F5F2EC;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.th{stroke:#F5F2EC;stroke-width:1.5;fill:none;stroke-opacity:.7}
.dm{stroke:#C5A45D;stroke-width:1.5;fill:none}
.ex{stroke:#F5F2EC;stroke-width:1;stroke-dasharray:4 4;opacity:.5;fill:none}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:dr 1.4s ease-out both}
.fade{animation:fd .8s ease-out both}
@media (prefers-reduced-motion:reduce){.draw,.fade,.pulse{animation:none!important}}
</style>
<defs><marker id="ba-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 1.5 L10 5 L0 8.5z" fill="#C5A45D"/></marker><pattern id="ba-dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#F5F2EC" fill-opacity=".75"/></pattern><pattern id="ba-hat" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9 L9 0" stroke="#F5F2EC" stroke-opacity=".35" stroke-width="1"/></pattern></defs>
<text class="h" x="40" y="44">Sección transversal de un banco de voladura</text>
<text class="s" x="40" y="66">Nomenclatura geométrica del diseño · esquema sin escala</text>
<path d="M40 360 L220 360 L300 140 L860 140 L860 500 L40 500Z" fill="#F5F2EC" fill-opacity=".07"/>
<rect x="40" y="450" width="260" height="50" fill="url(#ba-hat)"/>
<path class="th" d="M860 140 V500 H40 V360"/>
<path class="ln" d="M40 360 H220 L300 140 H860"/>
<rect x="373" y="140" width="14" height="75" fill="url(#ba-dots)"/>
<rect x="373" y="215" width="14" height="185" fill="#C5A45D" fill-opacity=".9"/>
<rect x="373" y="140" width="14" height="260" class="ln" style="stroke-width:1.5"/>
<path class="th" d="M373 215 H387"/>
<circle cx="380" cy="390" r="5" fill="#C5A45D" stroke="#F5F2EC" stroke-width="1.2"/>
<text class="sm" x="300" y="128" text-anchor="middle">Cresta</text>
<text class="sm" x="380" y="128" text-anchor="middle">Barreno</text>
<text class="sm" x="850" y="128" text-anchor="end">Superficie del banco</text>
<path class="th" d="M256 205 H272"/><text class="l" x="252" y="209" text-anchor="end">Cara libre</text>
<text class="sm" x="100" y="350">Piso del banco</text>
<text class="sm" x="212" y="380" text-anchor="end">Pie del banco</text>
<path class="ex" d="M300 140 H62"/>
<path class="dm draw" pathLength="1" d="M70 140 V360" marker-start="url(#ba-ar)" marker-end="url(#ba-ar)"/>
<text class="b" transform="translate(52 250) rotate(-90)" text-anchor="middle">H · altura de banco</text>
<path class="dm draw" pathLength="1" style="animation-delay:.3s" d="M226 345 H373" marker-start="url(#ba-ar)" marker-end="url(#ba-ar)"/>
<text class="b" x="300" y="334" text-anchor="middle">B · burden</text>
<path class="ex" d="M220 360 H478 M387 400 H478 M330 400 H373"/>
<path class="dm draw" pathLength="1" style="animation-delay:.5s" d="M430 140 V215" marker-start="url(#ba-ar)" marker-end="url(#ba-ar)"/>
<text class="b" x="442" y="183">T · taco (retacado)</text>
